[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "Research agent using LangChain + Gemini with timeouts and structured logging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Auto Generated" }]

dependencies = [
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",
  "langchain-google-genai>=1.0.0",
  "google-generativeai>=0.7.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7.4"]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0"
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
